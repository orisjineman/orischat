<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OrisChat</title>
  <meta name="theme-color" content="#4f7cff" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- 닉네임 입력 화면 -->
  <div id="login-screen" class="screen">
    <div class="login-box">
      <h1>OrisChat</h1>
      <p>닉네임을 입력하고 채팅을 시작하세요.</p>
      <input id="nickname-input" type="text" placeholder="닉네임" maxlength="20" autocomplete="off" />
      <input id="room-input" type="text" placeholder="방 이름 (선택, 비워두면 기본 방)" maxlength="30" autocomplete="off" />
      <input id="pin-input" type="password" placeholder="비밀번호" maxlength="50" autocomplete="off" class="hidden" />
      <p id="join-error" class="hidden"></p>
      <button id="join-btn">입장하기</button>
      <div id="room-list"></div>
    </div>
  </div>

  <!-- 채팅 화면 -->
  <div id="chat-screen" class="screen hidden">
    <aside id="sidebar">
      <h2>참여자</h2>
      <ul id="user-list"></ul>
    </aside>
    <main id="chat-main">
      <header id="chat-header">
        <span id="room-label">OrisChat</span>
        <div id="header-actions">
          <div id="avatar-btn-wrap">
            <button type="button" id="avatar-btn" aria-label="프로필 사진 크게 보기">🖼</button>
            <button type="button" id="avatar-edit-btn" aria-label="프로필 사진 변경">✏️</button>
          </div>
          <input id="avatar-file-input" type="file" accept="image/*" class="hidden" />
          <button type="button" id="search-btn" aria-label="검색">🔍</button>
          <button type="button" id="notify-btn" aria-label="알림 켜기">🔕 알림 켜기</button>
          <button type="button" id="theme-toggle-btn" aria-label="테마 선택">🌓</button>
        </div>
      </header>
      <!-- 엑셀/인텔리제이 테마일 때만 보이는 장식용 UI (실제 기능 없음, 순수 눈속임용) -->
      <div id="excel-ribbon" class="theme-chrome" aria-hidden="true">
        <div class="excel-ribbon-tabs">
          <span class="active">홈</span><span>삽입</span><span>페이지 레이아웃</span><span>수식</span><span>데이터</span><span>검토</span><span>보기</span>
        </div>
        <div class="excel-formula-bar">
          <span class="excel-cell-ref">A1</span>
          <span class="excel-fx">fx</span>
          <span class="excel-formula-text">=CONCAT(닉네임, ": ", 메시지)</span>
        </div>
      </div>
      <div id="intellij-chrome" class="theme-chrome" aria-hidden="true">
        <div class="intellij-menubar">File&nbsp;&nbsp;Edit&nbsp;&nbsp;View&nbsp;&nbsp;Navigate&nbsp;&nbsp;Code&nbsp;&nbsp;Refactor&nbsp;&nbsp;Build&nbsp;&nbsp;Run&nbsp;&nbsp;Tools&nbsp;&nbsp;VCS&nbsp;&nbsp;Window&nbsp;&nbsp;Help</div>
        <div class="intellij-tabs">
          <span class="active">ChatRoom.kt</span><span>MessageHandler.kt</span>
        </div>
      </div>
      <div id="search-panel" class="hidden">
        <form id="search-form">
          <input id="search-input" type="text" placeholder="메시지 검색" autocomplete="off" />
          <button type="submit">검색</button>
          <button type="button" id="search-close-btn" aria-label="검색 닫기">✕</button>
        </form>
        <div id="search-results"></div>
      </div>
      <div id="messages"></div>
      <button type="button" id="scroll-bottom-btn" class="hidden" aria-label="맨 아래로 이동">⬇</button>
      <div id="typing-indicator"></div>
      <div id="emoji-picker" class="hidden"></div>
      <div id="reply-banner" class="hidden">
        <span id="reply-banner-text"></span>
        <button type="button" id="reply-cancel-btn" aria-label="답장 취소">✕</button>
      </div>
      <form id="message-form">
        <button type="button" id="emoji-btn" aria-label="이모티콘">😊</button>
        <button type="button" id="attach-btn" aria-label="사진 첨부">📎</button>
        <input id="file-input" type="file" accept="image/*" class="hidden" />
        <div id="message-input-wrap">
          <input id="message-input" type="text" placeholder="메시지를 입력하세요" autocomplete="off" maxlength="500" />
        </div>
        <button type="submit">보내기</button>
      </form>
      <div id="intellij-statusbar" class="theme-chrome" aria-hidden="true">
        <span>🌿 main</span><span>UTF-8</span><span>4 spaces</span><span>Ln 1, Col 1</span>
      </div>
    </main>
  </div>

  <!-- 사진/스티커 클릭 시 확대해서 보는 라이트박스 -->
  <div id="image-lightbox" class="hidden">
    <img id="lightbox-img" alt="확대된 이미지" />
    <button type="button" id="lightbox-close-btn" aria-label="닫기">✕</button>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="client.js"></script>
</body>
</html>
