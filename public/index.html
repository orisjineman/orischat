<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OrisChat</title>
  <meta name="theme-color" content="#4f7cff" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- 닉네임 입력 화면 -->
  <div id="login-screen" class="screen">
    <div class="login-box">
      <h1>OrisChat</h1>
      <p>닉네임을 입력하고 채팅을 시작하세요.</p>
      <input id="nickname-input" type="text" placeholder="닉네임" maxlength="20" autocomplete="off" />
      <input id="room-input" type="text" placeholder="방 이름 (선택, 비워두면 기본 방)" maxlength="30" autocomplete="off" />
      <input id="pin-input" type="password" placeholder="비밀번호" maxlength="50" autocomplete="off" class="hidden" />
      <p id="join-error" class="hidden"></p>
      <button id="join-btn">입장하기</button>
      <div id="room-list"></div>
    </div>
  </div>

  <!-- 채팅 화면 -->
  <div id="chat-screen" class="screen hidden">
    <aside id="sidebar">
      <h2>참여자</h2>
      <ul id="user-list"></ul>
    </aside>
    <main id="chat-main">
      <header id="chat-header">
        <span id="room-label">OrisChat</span>
        <div id="header-actions">
          <button type="button" id="avatar-btn" aria-label="프로필 사진 설정">🖼</button>
          <input id="avatar-file-input" type="file" accept="image/*" class="hidden" />
          <button type="button" id="search-btn" aria-label="검색">🔍</button>
          <button type="button" id="notify-btn" aria-label="알림 켜기">🔕 알림 켜기</button>
          <button type="button" id="theme-toggle-btn" aria-label="라이트/다크 테마 전환">🌓</button>
        </div>
      </header>
      <div id="search-panel" class="hidden">
        <form id="search-form">
          <input id="search-input" type="text" placeholder="메시지 검색" autocomplete="off" />
          <button type="submit">검색</button>
          <button type="button" id="search-close-btn" aria-label="검색 닫기">✕</button>
        </form>
        <div id="search-results"></div>
      </div>
      <div id="messages"></div>
      <div id="typing-indicator"></div>
      <div id="emoji-picker" class="hidden"></div>
      <div id="reply-banner" class="hidden">
        <span id="reply-banner-text"></span>
        <button type="button" id="reply-cancel-btn" aria-label="답장 취소">✕</button>
      </div>
      <form id="message-form">
        <button type="button" id="emoji-btn" aria-label="이모티콘">😊</button>
        <button type="button" id="attach-btn" aria-label="사진 첨부">📎</button>
        <input id="file-input" type="file" accept="image/*" class="hidden" />
        <input id="message-input" type="text" placeholder="메시지를 입력하세요" autocomplete="off" maxlength="500" />
        <button type="submit">보내기</button>
      </form>
    </main>
  </div>

  <!-- 사진/스티커 클릭 시 확대해서 보는 라이트박스 -->
  <div id="image-lightbox" class="hidden">
    <img id="lightbox-img" alt="확대된 이미지" />
    <button type="button" id="lightbox-close-btn" aria-label="닫기">✕</button>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="client.js"></script>
</body>
</html>
