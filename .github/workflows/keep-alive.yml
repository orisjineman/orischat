name: Keep Render app awake

on:
  schedule:
    # Render 무료 플랜은 15분간 요청이 없으면 잠들기 때문에, 10분마다 핑을 보내서 항상 깨어있게 함
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping OrisChat
        run: curl -sf "${{ secrets.APP_URL }}" > /dev/null
